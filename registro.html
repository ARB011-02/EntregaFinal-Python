{% extends "base.html" %}
{% block titulo %}Registro — Blog Web{% endblock %}
{% block contenido %}
    <h1>Crear cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="boton" type="submit">Registrarme</button>
    </form>
    <p>¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
{% endblock %}
