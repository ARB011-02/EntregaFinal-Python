{% extends "base.html" %}
{% block titulo %}Mi perfil — Blog Web{% endblock %}
{% block contenido %}
    <h1>Mi perfil</h1>
    {% if perfil.avatar %}
        <img class="avatar-perfil" src="{{ perfil.avatar.url }}" alt="Avatar de {{ user.username }}">
    {% endif %}
    <p><strong>Usuario:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Bio:</strong> {{ perfil.bio|default:"(sin cargar)" }}</p>
    <a class="boton" href="{% url 'editar_perfil' %}">Editar perfil</a>
{% endblock %}
